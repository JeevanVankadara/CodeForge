# coturn for CodeForge voice.
#
# This server is only ever reached when two browsers cannot form a direct
# connection. When it is used, every byte of audio passes through it - so
# everything here is about keeping that fallback narrow, closed and cheap.

listening-port=3478

# No user database and no long-lived passwords. Credentials are minted per
# request by the API (controllers/iceServers.js) and verified here by signature
# alone. static-auth-secret and realm are passed on the command line by
# docker-compose, so the secret lives in Backend/.env and never in this file.
use-auth-secret

# Relay ports. Deliberately a narrow range: every one of them has to be
# published by Docker, and publishing the full default range is not something
# Docker enjoys. Must stay in step with the port mapping in docker-compose.yml.
min-port=49160
max-port=49200

fingerprint
no-multicast-peers

# On a cloud VM the machine usually knows only its private address, and would
# hand out a relay candidate nobody can reach. Uncomment with the public IP:
# external-ip=203.0.113.10

# ----------------------------------------------------------------------------
# An open TURN server will relay to anything you point it at, including hosts
# inside the private network it is sitting in. That turns a voice fallback into
# a way to reach your database from the internet. These denials are what stop it.
#
# NOTE FOR LOCAL TESTING: forcing relay between two browsers on your own machine
# means relaying to a private address, which these rules correctly refuse. See
# README.md - comment out the RFC1918 lines below only while testing locally.
# ----------------------------------------------------------------------------
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A relay session is one audio stream. Nothing legitimate here needs more, and a
# quota is the difference between a bad day and a bandwidth bill.
user-quota=12
total-quota=100

no-cli
log-file=stdout
simple-log
